<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임신주차 계산기 - 건강한학교</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>임신주차 계산기</h1>
        <p class="author">제작: 건강한학교</p>
        
        <div class="calculation-method">
            <label>계산 방법:</label>
            <div class="button-group">
                <button id="lmpBtn" class="active">마지막 생리일</button>
                <button id="conceptionBtn">수정일</button>
                <button id="dueDateBtn">출산 예정일</button>
            </div>
        </div>
        
        <div id="lmpInput" class="date-input">
            <label>마지막 생리 시작일:</label>
            <input type="date" id="lastPeriod">
        </div>
        
        <div id="conceptionInput" class="date-input hidden">
            <label>수정일 (또는 배란일):</label>
            <input type="date" id="conceptionDate">
        </div>
        
        <div id="dueDateInput" class="date-input hidden">
            <label>출산 예정일:</label>
            <input type="date" id="dueDate">
        </div>
        
        <button id="calculateBtn">계산하기</button>
        
        <div id="result" class="hidden">
            <h2>계산 결과</h2>
            
            <div class="result-grid">
                <div class="result-box">
                    <p class="result-label">현재 임신 주수</p>
                    <p id="weeks" class="result-value">0주 0일</p>
                </div>
                <div class="result-box">
                    <p class="result-label">삼분기</p>
                    <p id="trimester" class="result-value">1분기</p>
                </div>
                <div class="result-box span-full">
                    <p class="result-label" id="dateLabel">출산 예정일</p>
                    <p id="calculatedDate" class="result-value">YYYY-MM-DD</p>
                </div>
            </div>
            
            <div class="development-info">
                <h3>발달 정보</h3>
                <p id="developmentInfo"></p>
            </div>
            
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-labels">
                <span>0주</span>
                <span>20주</span>
                <span>40주</span>
            </div>
        </div>
        
        <div class="disclaimer">
            <p>참고: 이 계산기는 정보 제공을 위한 것이며 의학적 조언을 대체할 수 없습니다. 정확한 정보를 위해 의사와 상담하세요.</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
